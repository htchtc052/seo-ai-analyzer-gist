name: seo-ai-analyzer-gist

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seo_ai_analyzer_gist
      POSTGRES_PASSWORD: seo_ai_analyzer_gist
      POSTGRES_DB: seo_ai_analyzer_gist
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_ai_analyzer_gist"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
