<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SEO AI Analyzer — варианты</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 3rem 1.5rem;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
        letter-spacing: 0.02em;
        margin: 0 0 2rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li + li {
        margin-top: 0.75rem;
      }
      a {
        display: block;
        padding: 1rem 1.25rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        text-decoration: none;
        color: inherit;
      }
      a:hover {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      b {
        display: block;
        font-size: 1.05rem;
      }
      span {
        opacity: 0.7;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SEO AI ANALYZER</h1>
      <ul>
        <li>
          <a href="/v5/">
            <b>v5 — сопоставление абзацев</b>
            <span>Запрос, наша страница и до четырёх страниц конкурентов</span>
          </a>
        </li>
        <li>
          <a href="/v4/">
            <b>v4 — карта близости статей</b>
            <span>Отбор источников в духе GIST на уровне страниц целиком</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
