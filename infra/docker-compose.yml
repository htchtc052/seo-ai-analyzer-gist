name: seo-ai-analyzer

x-api: &api
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-api-env: &api-env
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 3001
  WEB_ORIGIN: https://${APP_DOMAIN}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL}

x-web: &web
  restart: unless-stopped

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt

  landing:
    <<: *web
    build:
      context: ..
      dockerfile: apps/landing/.docker/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.landing.priority=1
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=letsencrypt
      - traefik.http.services.landing.loadbalancer.server.port=80

  v1-api:
    <<: *api
    build:
      context: ..
      dockerfile: apps/v1/api/.docker/Dockerfile
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB_V1}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@host.docker.internal:6379/0
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.v1-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v1/api`)
      - traefik.http.routers.v1-api.priority=20
      - traefik.http.routers.v1-api.entrypoints=websecure
      - traefik.http.routers.v1-api.tls.certresolver=letsencrypt
      - traefik.http.routers.v1-api.middlewares=v1-api-strip
      - traefik.http.middlewares.v1-api-strip.stripprefix.prefixes=/v1
      - traefik.http.services.v1-api.loadbalancer.server.port=3001

  v1-web:
    <<: *web
    build:
      context: ..
      dockerfile: apps/v1/web/.docker/Dockerfile
      args:
        APP_BASE_PATH: /v1/
    labels:
      - traefik.enable=true
      - traefik.http.routers.v1-web.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v1`)
      - traefik.http.routers.v1-web.priority=10
      - traefik.http.routers.v1-web.entrypoints=websecure
      - traefik.http.routers.v1-web.tls.certresolver=letsencrypt
      - traefik.http.routers.v1-web.middlewares=v1-web-strip
      - traefik.http.middlewares.v1-web-strip.stripprefix.prefixes=/v1
      - traefik.http.services.v1-web.loadbalancer.server.port=80

  v2-api:
    <<: *api
    build:
      context: ..
      dockerfile: apps/v2/api/.docker/Dockerfile
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB_V2}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@host.docker.internal:6379/1
    labels:
      - traefik.enable=true
      - traefik.http.routers.v2-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v2/api`)
      - traefik.http.routers.v2-api.priority=20
      - traefik.http.routers.v2-api.entrypoints=websecure
      - traefik.http.routers.v2-api.tls.certresolver=letsencrypt
      - traefik.http.routers.v2-api.middlewares=v2-api-strip
      - traefik.http.middlewares.v2-api-strip.stripprefix.prefixes=/v2
      - traefik.http.services.v2-api.loadbalancer.server.port=3001

  v2-web:
    <<: *web
    build:
      context: ..
      dockerfile: apps/v2/web/.docker/Dockerfile
      args:
        APP_BASE_PATH: /v2/
    labels:
      - traefik.enable=true
      - traefik.http.routers.v2-web.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v2`)
      - traefik.http.routers.v2-web.priority=10
      - traefik.http.routers.v2-web.entrypoints=websecure
      - traefik.http.routers.v2-web.tls.certresolver=letsencrypt
      - traefik.http.routers.v2-web.middlewares=v2-web-strip
      - traefik.http.middlewares.v2-web-strip.stripprefix.prefixes=/v2
      - traefik.http.services.v2-web.loadbalancer.server.port=80

  v3-api:
    <<: *api
    build:
      context: ..
      dockerfile: apps/v3/api/.docker/Dockerfile
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB_V3}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@host.docker.internal:6379/2
    labels:
      - traefik.enable=true
      - traefik.http.routers.v3-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v3/api`)
      - traefik.http.routers.v3-api.priority=20
      - traefik.http.routers.v3-api.entrypoints=websecure
      - traefik.http.routers.v3-api.tls.certresolver=letsencrypt
      - traefik.http.routers.v3-api.middlewares=v3-api-strip
      - traefik.http.middlewares.v3-api-strip.stripprefix.prefixes=/v3
      - traefik.http.services.v3-api.loadbalancer.server.port=3001

  v3-web:
    <<: *web
    build:
      context: ..
      dockerfile: apps/v3/web/.docker/Dockerfile
      args:
        APP_BASE_PATH: /v3/
    labels:
      - traefik.enable=true
      - traefik.http.routers.v3-web.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/v3`)
      - traefik.http.routers.v3-web.priority=10
      - traefik.http.routers.v3-web.entrypoints=websecure
      - traefik.http.routers.v3-web.tls.certresolver=letsencrypt
      - traefik.http.routers.v3-web.middlewares=v3-web-strip
      - traefik.http.middlewares.v3-web-strip.stripprefix.prefixes=/v3
      - traefik.http.services.v3-web.loadbalancer.server.port=80

volumes:
  traefik_acme:
